# Checks the live site's webcam status every 30 minutes.
# Opens a GitHub issue (which emails the repo owner) when the park cam goes offline,
# and closes it with a comment when the stream comes back.
name: Webcam monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: webcam-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LABEL: webcam-offline
    steps:
      - name: Check webcam status
        run: |
          set -euo pipefail
          # Small dedicated endpoint: just the cam's live-status lookup, not the full river data
          body=$(curl -sS --max-time 60 -w '\n%{http_code}' https://bendsurfreport.com/api/webcam) || {
            echo "::warning::Site unreachable; skipping this run."; exit 0; }
          code=$(printf '%s' "$body" | tail -n1)
          body=$(printf '%s' "$body" | sed '$d')
          if ! printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
            echo "::warning::/api/webcam returned HTTP $code with non-JSON body; skipping. First 300 chars:"
            printf '%s' "$body" | head -c 300; echo
            exit 0
          fi
          live=$(printf '%s' "$body" | jq -r '.isLive')
          video=$(printf '%s' "$body" | jq -r '"https://www.youtube.com/watch?v=" + (.videoId // "")')
          note=$(printf '%s' "$body" | jq -r '.lookupNote // "none"')
          source=$(printf '%s' "$body" | jq -r '.source // "?"')
          echo "isLive=$live source=$source video=$video note=$note"

          gh label create "$LABEL" --color D93F0B --description "Park webcam stream is down" 2>/dev/null || true
          open_issue=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "$live" = "false" ]; then
            if [ -z "$open_issue" ]; then
              gh issue create --label "$LABEL" \
                --title "Park webcam is offline" \
                --body "The Bulletin's park cam stream is not live as of $(date -u '+%Y-%m-%d %H:%M UTC').

          Lookup saw: $note

          The site keeps the player up and labels it \"Stream may be offline\"; it switches back on its own when the stream returns. This issue closes automatically when it does.

          If the stream is live on YouTube under a title the site doesn't recognize, check https://www.youtube.com/@bendbulletin/streams. A specific video ID can be forced with the \`PARK_CAM_VIDEO_ID\` environment variable in Vercel."
            fi
          elif [ "$live" = "true" ] && [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "Stream is live again ($video) as of $(date -u '+%Y-%m-%d %H:%M UTC')."
          elif [ "$live" = "null" ]; then
            echo "::warning::Webcam status unknown (lookup saw: $note). Not alerting."
          else
            echo "No change needed."
          fi
